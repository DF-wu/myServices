# Optional settings management. Apply AFTER hardware/model overrides.
# Blank daily variables let the saved settings file supply defaults; explicit
# nonempty .env values remain authoritative and are shown as locked in the UI.
services:
  capswriter-server:
    environment:
      CAPSWRITER_HTTP_API_ENABLE: "true"
      CAPSWRITER_SETTINGS_ENABLE: "true"
      CAPSWRITER_SETTINGS_PATH: /app/settings/server-settings.json
      CAPSWRITER_MODEL_TYPE: ${CAPSWRITER_MODEL_TYPE:-}
      CAPSWRITER_QWEN_PRESET: ${CAPSWRITER_QWEN_PRESET:-}
      CAPSWRITER_GPU_BOOST_ENABLED: ${CAPSWRITER_GPU_BOOST_ENABLED:-}
      CAPSWRITER_GPU_BOOST_DEVICE: ${CAPSWRITER_GPU_BOOST_DEVICE:-}
      CAPSWRITER_GPU_BOOST_MEMORY_CLOCK_MHZ: ${CAPSWRITER_GPU_BOOST_MEMORY_CLOCK_MHZ:-}
      CAPSWRITER_GPU_BOOST_IDLE_SECONDS: ${CAPSWRITER_GPU_BOOST_IDLE_SECONDS:-}
      CAPSWRITER_INFERENCE_HARDWARE: ${CAPSWRITER_INFERENCE_HARDWARE:-}
      CAPSWRITER_NUM_THREADS: ${CAPSWRITER_NUM_THREADS:-}
      CAPSWRITER_FORMAT_NUM: ${CAPSWRITER_FORMAT_NUM:-}
      CAPSWRITER_FORMAT_SPELL: ${CAPSWRITER_FORMAT_SPELL:-}
      CAPSWRITER_HTTP_API_MAX_UPLOAD_MB: ${CAPSWRITER_HTTP_API_MAX_UPLOAD_MB:-}
      CAPSWRITER_HTTP_API_MAX_AUDIO_SECONDS: ${CAPSWRITER_HTTP_API_MAX_AUDIO_SECONDS:-}
      CAPSWRITER_HTTP_API_TASK_TIMEOUT: ${CAPSWRITER_HTTP_API_TASK_TIMEOUT:-}
      CAPSWRITER_HTTP_API_MAX_CONCURRENT_REQUESTS: ${CAPSWRITER_HTTP_API_MAX_CONCURRENT_REQUESTS:-}
      CAPSWRITER_HTTP_API_MAX_PENDING_REQUESTS: ${CAPSWRITER_HTTP_API_MAX_PENDING_REQUESTS:-}
      CAPSWRITER_SERVER_MAX_WEBSOCKET_CONNECTIONS: ${CAPSWRITER_SERVER_MAX_WEBSOCKET_CONNECTIONS:-}
      CAPSWRITER_SERVER_MAX_WEBSOCKET_TASK_SECONDS: ${CAPSWRITER_SERVER_MAX_WEBSOCKET_TASK_SECONDS:-}
    ports:
      - "${CAPSWRITER_HTTP_API_PUBLISH_HOST:-0.0.0.0}:${CAPSWRITER_HTTP_API_PORT:-6017}:${CAPSWRITER_HTTP_API_PORT:-6017}"
    volumes:
      - capswriter-server-settings:/app/settings

volumes:
  capswriter-server-settings:
