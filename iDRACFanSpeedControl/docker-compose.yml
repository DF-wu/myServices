# TrueNAS SCALE 25.10 Custom App YAML。
# 貼入 Apps > Discover > Custom App > Install via YAML 後，先替換三個
# REPLACE_TO_YOUR_* 欄位；程式會拒絕使用未替換的 placeholder。
services:
  idrac-fan-control:
    # 固定到已通過 TrueNAS Compose 與變數契約驗證的映像。
    image: ghcr.io/df-wu/idrac-fan-control@sha256:0a4d1352636bc6ea3391b654864ece3f41e5d2a22aafd096d3b2af27376debeb
    container_name: idrac-fan-control

    environment:
      TZ: Asia/Taipei

      # TrueNAS UI 必填機密；不要把替換後的 YAML 提交回 Git。
      IDRAC_IP: 192.168.10.8
      IDRAC_ID: root
      IDRAC_PASSWORD: REPLACE_TO_YOUR_IDRAC_PASSWORD
      IPMI_INTERFACE: lanplus
      IPMI_TIMEOUT: "5"
      IPMI_RETRIES: "2"

      OPERATION_MODE: auto
      CHECK_INTERVAL: "60"
      COMMAND_TIMEOUT: "20"
      DRY_RUN: "false"
      LOG_LEVEL: INFO
      RESTORE_AUTO_ON_EXIT: "true"

      # R730xd iDRAC sensors + axolotl 遠端 Tesla P4。
      # TrueNAS 看到的是 VMware Virtual NVMe Disk，其 SMART log 不可信。
      TEMPERATURE_SOURCES: idrac,remote_gpu
      WITH_GPU_TEMP: "false"
      GPU_TEMP_OFFSET: "15"

      LINUX_DISK_DEVICES: /dev/nvme0
      LINUX_DISK_TEMP_OFFSET: "0"
      LINUX_DISK_NOCHECK: never

      REMOTE_GPU_HOSTS: 192.168.10.13
      REMOTE_GPU_USERNAME: REPLACE_TO_YOUR_AXOLOTL_SSH_USER
      REMOTE_GPU_PASSWORD: REPLACE_TO_YOUR_AXOLOTL_SSH_PASSWORD
      REMOTE_GPU_SSH_KEY: ""
      REMOTE_GPU_SSH_PORT: "22"
      REMOTE_GPU_TEMP_OFFSET: "15"
      SSH_CONNECT_TIMEOUT: "10"
      SSH_STRICT_HOST_KEY_CHECKING: accept-new

      TEMP_LOW: "65"
      TEMP_MEDIUM: "70"
      TEMP_HIGH: "75"
      TEMP_CRITICAL: "80"

      FAN_SPEED_IDLE: "25"
      FAN_SPEED_LOW: "35"
      FAN_SPEED_MEDIUM: "45"
      FAN_SPEED_HIGH: "55"
      FAN_SPEED_CRITICAL: "65"

      HYSTERESIS: "2"
      FAILSAFE_ON_ERROR: "true"
      FAILSAFE_FAN_SPEED: "70"
      MANUAL_FAN_SPEED: "35"

      IDRAC_SENSOR_INCLUDE_REGEX: ""
      IDRAC_SENSOR_EXCLUDE_REGEX: no reading|disabled|not readable
      LOG_DIR: /var/log/fan-control
      LOG_FILE: fan_control.log
      HEALTHCHECK_MAX_AGE: "0"

    volumes:
      - /mnt/cachePool/appdata/idrac-fan-control/logs:/var/log/fan-control

    # 預留足夠時間讓 SIGTERM trap 恢復 Dell 自動風扇控制。
    stop_grace_period: 45s
    restart: unless-stopped
