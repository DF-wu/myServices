# Schema and capabilities verified against LibreChat v0.8.8 (prerelease).
version: 1.3.17
cache: true

endpoints:
  custom:
    - name: ChatStack
      apiKey: '${LIBRECHAT_NEW_API_KEY}'
      baseURL: http://new-api:3000/v1
      models:
        # The pinned model loader does NOT expand env variables in model names.
        # Replace this literal with the exact tested vision + tool-calling model ID.
        # Startup refuses the placeholder. A /models listing alone is not a capability test.
        default: [REPLACE_WITH_VERIFIED_VISION_MODEL]
        # Keep only explicitly verified pilot models; gateway discovery would replace
        # this allowlist and could expose models without vision/tool-calling support.
        fetch: false
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: ChatStack
  agents:
    # Build the pilot Agent with ChatStack as provider and the tested model above.
    allowedProviders: [ChatStack]
    capabilities: [file_search, web_search, context, ocr]

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  tavilyApiKey: '${LIBRECHAT_TAVILY_API_KEY}'
  # Full endpoints, not a provider root URL. Compose supplies official defaults.
  tavilySearchUrl: '${LIBRECHAT_TAVILY_SEARCH_URL}'
  tavilyExtractUrl: '${LIBRECHAT_TAVILY_EXTRACT_URL}'
  tavilySearchOptions:
    searchDepth: basic
    maxResults: 5
    topic: general
  rerankerType: none

fileConfig:
  serverFileSizeLimit: 20
  avatarSizeLimit: 2
  endpoints:
    default: &pilot_file_limits
      fileLimit: 5
      fileSizeLimit: 20
      totalSizeLimit: 100
      supportedMimeTypes:
        - '^image/(png|jpeg|webp|gif)$'
        - '^application/pdf$'
        - '^application/vnd\.openxmlformats-officedocument\.wordprocessingml\.document$'
    # Explicitly set native Agents limits as well as custom endpoint limits.
    agents: *pilot_file_limits
    ChatStack: *pilot_file_limits

# Optional Mistral OCR: leave absent until a real key/provider is configured and
# scanned-PDF acceptance tests pass. Text PDF/DOCX can use document_parser without it.
# Set LIBRECHAT_OCR_API_KEY, verify LIBRECHAT_OCR_BASEURL, then uncomment this block.
# ocr:
#   strategy: mistral_ocr
#   apiKey: '${OCR_API_KEY}'
#   baseURL: '${OCR_BASEURL}'
#   mistralModel: mistral-ocr-latest
# For a trusted private OCR service, explicitly configure its host:port allowlist;
# do not add arbitrary URLs or broad network ranges.
