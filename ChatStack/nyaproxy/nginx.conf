worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker DNS: recover when nyaproxy is recreated with a new container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Explicit Authorization wins. Exa-only clients can use x-api-key instead.
    map $http_authorization $exa_authorization {
        "" "Bearer $http_x_api_key";
        default $http_authorization;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 32m;
        set $nyaproxy_upstream http://nyaproxy:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Keep the URI/query and raw body; only translate the downstream auth header.
        location ^~ /api/exa/ {
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Authorization $exa_authorization;
            proxy_set_header x-api-key "";
            # Same-origin UI cookies contain admin credentials; never relay them to Exa.
            proxy_set_header Cookie "";
            proxy_pass $nyaproxy_upstream;
        }

        # Dashboard/config login and Bearer/cookie auth remain NyaProxy's responsibility.
        location / {
            proxy_pass $nyaproxy_upstream;
        }
    }
}
