    entrypoint:
    - /bin/bash
    - -ec
    command:
    - |-
      set -a
      . /run/codeauth/auth.env
      set +a
      exec /usr/local/bin/entrypoint.sh
    environment:
      TZ: Asia/Taipei
      KVM_ENABLED: 'false'
      SANDBOX_USE_CGROUPV2: 'false'
      SANDBOX_REMOVE_UMOUNT_AFTER_STARTUP: 'false'
      CODEAPI_HARDENED_SANDBOX_MODE: 'true'
      SANDBOX_REQUIRE_EGRESS_MANIFEST: 'true'
      EGRESS_GATEWAY_URL: http://librechat-code-egress:3190
      SANDBOX_FORWARD_TARGET: librechat-code-egress:3190
      SANDBOX_ALLOWED_LOCAL_NETWORK_PORT: '3190'
      SANDBOX_PACKAGES_DIRECTORY: /pkgs
      SANDBOX_OUTPUT_MAX_SIZE: '65536'
      SANDBOX_RUN_TIMEOUT: '300000'
      SANDBOX_RUN_CPU_TIME: '300000'
      SANDBOX_COMPILE_TIMEOUT: '30000'
      SANDBOX_MAX_CONCURRENT_JOBS: '2'
      SANDBOX_PER_JOB_UIDS: 'true'
      SANDBOX_JOB_UID_BASE: '200000'
      SANDBOX_JOB_GID_BASE: '200000'
      SANDBOX_RLIMIT_AS: '16384'
      SANDBOX_RLIMIT_FSIZE: '100'
      SANDBOX_LOG_LEVEL: INFO
    volumes:
    - type: volume
      source: librechat_code_packages_v1_10_13
      target: /host-packages
      read_only: true
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_runner
      target: /run/codeauth
      read_only: true
      volume:
        nocopy: true
    depends_on:
      librechat-code-init:
        condition: service_completed_successfully
      librechat-code-packages:
        condition: service_completed_successfully
      librechat-code-egress:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:2000/api/v2/runtimes
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  librechat-code-redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    user: 1000:1000
    networks:
    - librechat-code
    mem_limit: 384m
    command:
    - redis-server
    - /run/codeauth/redis.conf
    volumes:
    - type: volume
      source: librechat_code_auth_redis
      target: /run/codeauth
      read_only: true
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_redis_data
      target: /data
      read_only: false
      volume:
        nocopy: true
    depends_on:
      librechat-code-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - . /run/codeauth/auth.env; REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 5
  librechat-code-storage:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    user: 1000:1000
    networks:
    - librechat-code
    mem_limit: 1g
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |-
      set -a
      . /run/codeauth/auth.env
      set +a
      exec /usr/bin/rustfs /data
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOG_DIRECTORY: /data/.logs
      RUSTFS_OBS_LOGGER_LEVEL: warn
      TZ: Asia/Taipei
    volumes:
    - type: volume
      source: librechat_code_auth_storage
      target: /run/codeauth
      read_only: true
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_storage_data
      target: /data
      read_only: false
      volume:
        nocopy: true
    depends_on:
      librechat-code-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:9000/health/ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
