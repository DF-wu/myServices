  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    # image: ghcr.io/seakee/cpa-manager-plus
    container_name: cli-proxy-api
    restart: unless-stopped
    network_mode: service:gluetun-proxy
    depends_on:
      - gluetun-proxy

    # because network interface is replaced by another container.
    # expose ports here will not work.
    # ports:
    #   - "8317:8317"
    volumes:
      # legacy config and logs
      - /mnt/appdata/CLIProxyAPI-plus/config.yaml:/CLIProxyAPI/config.yaml
      - /mnt/appdata/CLIProxyAPI-plus/auth:/root/.cli-proxy-api
      - /mnt/appdata/CLIProxyAPI-plus/logs:/CLIProxyAPI/logs
      # new cpamc plus
      # - /mnt/appdata/CLIProxyAPI-plus/cpa-manager-plus-data:/data

  gluetun-proxy:
    image: qmcgaw/gluetun
    container_name: gluetun-proxy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 19000:8888/tcp # HTTP proxy

      # for CLIproxyAPI-plus
      - 8317:8317
    volumes:
      - /mnt/appdata/gluetun:/gluetun
    environment:
      # 基本 VPN 設定 (必填)
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${SURFSHARK_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.14.0.2/16
      # - OPENVPN_CUSTOM_CONFIG=/gluetun/surfshark-ovpn/se-sto.prod.surfshark.com_udp.ovpn
      # - SERVER_COUNTRIES=Sweden
      - SERVER_CITIES=Phoenix
      # 系統設定
      - TZ=${TZ:-Asia/Taipei}
      - UMASK=000
      # ===== 修復 1: 關掉 DNS-over-TLS，改用 plaintext =====
      # DoT 通過高延遲 VPN 隧道 (台灣→Sweden ~340ms) TLS handshake 經常 reset
      - DOT=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
      # ===== 修復 2: 用 IP-based healthcheck，避免 DNS 依賴 =====
      # VPN tunnel 本身通 (ping OK)，但 DNS 暫時故障會誤觸 VPN 重啟→死亡螺旋
      - HEALTH_TARGET_ADDRESS=1.1.1.1
      - HEALTH_SUCCESS_WAIT_DURATION=15s
      # 伺服器選擇 (可選)
      # - SERVER_COUNTRIES="Romania"
      # - SERVER_REGIONS="București"
      # - SERVER_CITIES="Bucharest"
      # - SERVER_HOSTNAMES="ro2-auto-udp.ptoserver.com"

  # =============================================================================
  # Lilac - Discord AI Agent Runtime (js-llmcord successor)
  # repo: https://github.com/DF-wu/lilac-mono
  # doc: https://github.com/stanley2058/lilac-mono/blob/main/PROJECT.md
  # GHCR catalina/latest and claudia images use /home/Catalina and /home/Claudia, not upstream /home/lilac.
  # Runtime state now lives under /data, including XDG config, git config, gpg, and bun/npm state.
  # =============================================================================
  lilac-catalina:
    container_name: lilac-mono-catalina
    image: ghcr.io/df-wu/lilac-mono:catalina
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
      - LOG_LEVEL=debug
      - REDIS_URL=redis://chatstack-unified-redis:6379/5
      - DATA_DIR=/data
      - LILAC_WORKSPACE_DIR=/data/workspace
      - GIT_CONFIG_GLOBAL=/data/.gitconfig
      - GNUPGHOME=/data/secret/gnupg
      - BUN_INSTALL_GLOBAL_DIR=/data/.bun/install/global
      - BUN_INSTALL_BIN=/data/bin
      - BUN_INSTALL_CACHE_DIR=/data/.bun/install/cache
      - NPM_CONFIG_PREFIX=/data/.npm-global
      - XDG_CONFIG_HOME=/data/.config
      - LL_TOOL_SERVER_PORT=8080

      # GitHub webhook ingress (GitHub App)
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_WEBHOOK_PORT=${GITHUB_WEBHOOK_PORT:-8787}
      - GITHUB_WEBHOOK_PATH=${GITHUB_WEBHOOK_PATH:-/github/webhook}
      # Provider: OpenAI / OpenAI-compatible / Anthropic-compatible
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY_CATALINA}
      - OPENAI_COMPATIBLE_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL}
      - OPENAI_COMPATIBLE_API_KEY=${OPENAI_COMPATIBLE_API_KEY_CATALINA}
      # Anthropic-native requests are intentionally pointed at the same upstream base URL
      # as OPENAI_COMPATIBLE_BASE_URL. This only works if that upstream/proxy also accepts
      # Anthropic Messages API requests on the same base prefix.
      - ANTHROPIC_BASE_URL=${OPENAI_COMPATIBLE_BASE_URL}
      # Catalina uses its own OpenAI-compatible key as the Anthropic key as well.
      - ANTHROPIC_API_KEY=${OPENAI_COMPATIBLE_API_KEY_CATALINA}

      # Discord bot token
      - DISCORD_TOKEN=${DISCORD_TOKEN}

      # Native web UI (surface.native in core-config.yaml): local owner login + session signing
      - LILAC_NATIVE_LOCAL_USERNAME=${LILAC_NATIVE_LOCAL_USERNAME}
      - LILAC_NATIVE_LOCAL_PASSWORD_HASH=${LILAC_NATIVE_LOCAL_PASSWORD_HASH}
      - LILAC_NATIVE_SESSION_SECRET=${LILAC_NATIVE_SESSION_SECRET}

      # smart-search runtime config (shared env names; values injected by host env)
      - SMART_SEARCH_CONFIG_DIR=/data/.config/smart-search
      - XAI_API_URL=${SMART_SEARCH_XAI_API_URL:-https://api.x.ai/v1}
      - XAI_API_KEY=${SMART_SEARCH_XAI_API_KEY:-}
      - XAI_MODEL=${SMART_SEARCH_XAI_MODEL:-grok-4-fast}
      - XAI_TOOLS=${SMART_SEARCH_XAI_TOOLS:-web_search,x_search}
      - OPENAI_COMPATIBLE_API_URL=${SMART_SEARCH_OPENAI_COMPATIBLE_API_URL:-}
      - OPENAI_COMPATIBLE_MODEL=${SMART_SEARCH_OPENAI_COMPATIBLE_MODEL:-grok-4-fast}
      - OPENAI_COMPATIBLE_STREAM=${SMART_SEARCH_OPENAI_COMPATIBLE_STREAM:-false}
      - INTENT_EMBEDDING_API_URL=${SMART_SEARCH_INTENT_EMBEDDING_API_URL:-}
      - INTENT_EMBEDDING_API_KEY=${SMART_SEARCH_INTENT_EMBEDDING_API_KEY:-}
      - INTENT_EMBEDDING_MODEL=${SMART_SEARCH_INTENT_EMBEDDING_MODEL:-}
      - INTENT_EMBEDDING_THRESHOLD=${SMART_SEARCH_INTENT_EMBEDDING_THRESHOLD:-0.74}
      - INTENT_EMBEDDING_MARGIN=${SMART_SEARCH_INTENT_EMBEDDING_MARGIN:-0.05}
      - INTENT_CLASSIFIER_API_URL=${SMART_SEARCH_INTENT_CLASSIFIER_API_URL:-}
      - INTENT_CLASSIFIER_API_KEY=${SMART_SEARCH_INTENT_CLASSIFIER_API_KEY:-}
      - INTENT_CLASSIFIER_MODEL=${SMART_SEARCH_INTENT_CLASSIFIER_MODEL:-}
      - INTENT_ROUTER_TIMEOUT_SECONDS=${SMART_SEARCH_INTENT_ROUTER_TIMEOUT_SECONDS:-8}
      - SMART_SEARCH_VALIDATION_LEVEL=${SMART_SEARCH_VALIDATION_LEVEL:-balanced}
      - SMART_SEARCH_FALLBACK_MODE=${SMART_SEARCH_FALLBACK_MODE:-auto}
      - SMART_SEARCH_MINIMUM_PROFILE=${SMART_SEARCH_MINIMUM_PROFILE:-standard}
      - SMART_SEARCH_INTENT_ROUTER=${SMART_SEARCH_INTENT_ROUTER:-hybrid}
      - SMART_SEARCH_RESEARCH_PREFERRED_PROVIDERS=${SMART_SEARCH_RESEARCH_PREFERRED_PROVIDERS:-}
      - SMART_SEARCH_RESEARCH_DISABLED_PROVIDERS=${SMART_SEARCH_RESEARCH_DISABLED_PROVIDERS:-}
      - EXA_API_KEY=${SMART_SEARCH_EXA_API_KEY:-${EXA_API_KEY}}
      - EXA_BASE_URL=${SMART_SEARCH_EXA_BASE_URL:-https://api.exa.ai}
      - CONTEXT7_API_KEY=${SMART_SEARCH_CONTEXT7_API_KEY:-}
      - CONTEXT7_BASE_URL=${SMART_SEARCH_CONTEXT7_BASE_URL:-https://context7.com}
      - ZHIPU_API_KEY=${SMART_SEARCH_ZHIPU_API_KEY:-}
      - ZHIPU_API_URL=${SMART_SEARCH_ZHIPU_API_URL:-https://open.bigmodel.cn/api}
      - ZHIPU_SEARCH_ENGINE=${SMART_SEARCH_ZHIPU_SEARCH_ENGINE:-search_std}
      - JINA_API_KEY=${SMART_SEARCH_JINA_API_KEY:-}
      - JINA_READER_API_URL=${SMART_SEARCH_JINA_READER_API_URL:-https://r.jina.ai/http}
      - TAVILY_API_BASE_URL=${TAVILY_API_BASE_URL:-https://api.tavily.com}
      - TAVILY_API_URL=${SMART_SEARCH_TAVILY_API_URL:-${TAVILY_API_BASE_URL:-https://api.tavily.com}}
      - TAVILY_API_KEY=${SMART_SEARCH_TAVILY_API_KEY:-${TAVILY_API_KEY}}
      - FIRECRAWL_API_URL=${SMART_SEARCH_FIRECRAWL_API_URL:-https://api.firecrawl.dev/v2}
      - FIRECRAWL_API_KEY=${SMART_SEARCH_FIRECRAWL_API_KEY:-${FIRECRAWL_API_KEY}}
      # Lilac web.search/web.extract firecrawl provider; empty falls back to https://api.firecrawl.dev
      - FIRECRAWL_API_BASE_URL=${FIRECRAWL_API_BASE_URL:-}
      - ANYSEARCH_API_URL=${SMART_SEARCH_ANYSEARCH_API_URL:-https://api.anysearch.com/mcp}
      - ANYSEARCH_API_KEY=${SMART_SEARCH_ANYSEARCH_API_KEY:-}
      - EXA_TIMEOUT_SECONDS=${SMART_SEARCH_EXA_TIMEOUT_SECONDS:-30}
      - CONTEXT7_TIMEOUT_SECONDS=${SMART_SEARCH_CONTEXT7_TIMEOUT_SECONDS:-30}
      - ZHIPU_TIMEOUT_SECONDS=${SMART_SEARCH_ZHIPU_TIMEOUT_SECONDS:-30}
      - ZHIPU_MCP_API_KEY=${SMART_SEARCH_ZHIPU_MCP_API_KEY:-}
      - ZHIPU_MCP_SEARCH_API_URL=${SMART_SEARCH_ZHIPU_MCP_SEARCH_API_URL:-}
      - ZHIPU_MCP_READER_API_URL=${SMART_SEARCH_ZHIPU_MCP_READER_API_URL:-}
      - ZHIPU_MCP_ZREAD_API_URL=${SMART_SEARCH_ZHIPU_MCP_ZREAD_API_URL:-}
      - ZHIPU_MCP_TIMEOUT_SECONDS=${SMART_SEARCH_ZHIPU_MCP_TIMEOUT_SECONDS:-30}
      - JINA_TIMEOUT_SECONDS=${SMART_SEARCH_JINA_TIMEOUT_SECONDS:-30}
      - JINA_RESPOND_WITH=${SMART_SEARCH_JINA_RESPOND_WITH:-markdown}
      - TAVILY_ENABLED=${SMART_SEARCH_TAVILY_ENABLED:-true}
      - TAVILY_TIMEOUT_SECONDS=${SMART_SEARCH_TAVILY_TIMEOUT_SECONDS:-30}
      - ANYSEARCH_TIMEOUT_SECONDS=${SMART_SEARCH_ANYSEARCH_TIMEOUT_SECONDS:-30}
      - SMART_SEARCH_DEBUG=${SMART_SEARCH_DEBUG:-false}
      - SMART_SEARCH_LOG_LEVEL=${SMART_SEARCH_LOG_LEVEL:-INFO}
      - SMART_SEARCH_LOG_DIR=${SMART_SEARCH_LOG_DIR:-logs}
      - SMART_SEARCH_RETRY_MAX_ATTEMPTS=${SMART_SEARCH_RETRY_MAX_ATTEMPTS:-3}
      - SMART_SEARCH_RETRY_MULTIPLIER=${SMART_SEARCH_RETRY_MULTIPLIER:-1}
      - SMART_SEARCH_RETRY_MAX_WAIT=${SMART_SEARCH_RETRY_MAX_WAIT:-10}
      - SMART_SEARCH_OUTPUT_CLEANUP=${SMART_SEARCH_OUTPUT_CLEANUP:-true}
      - SMART_SEARCH_LOG_TO_FILE=${SMART_SEARCH_LOG_TO_FILE:-false}
      - SSL_VERIFY=${SMART_SEARCH_SSL_VERIFY:-true}
      # Wire debug controls; default disabled.
      - LILAC_LLM_WIRE_DEBUG=${LILAC_LLM_WIRE_DEBUG:-0}
      - LILAC_LLM_WIRE_DEBUG_DIR=/data/debug/llm-wire
      - LILAC_LLM_WIRE_DEBUG_MAX_BODY_BYTES=65536
      - LILAC_LLM_WIRE_DEBUG_MAX_EVENTS=400

    volumes:
      - /mnt/appdata/ChatStack/lilac-mono/data:/data
      - /home/df/.agents:/home/Catalina/.agents
      - /mnt/appdata/ChatStack/lilac-mono/.ssh:/home/Catalina/.ssh
      # - /home/df/.ssh:/home/Catalina/.ssh
      - /mnt/appdata/ChatStack/lilac-mono/data/.cache:/home/Catalina/.cache
    depends_on:
      chatstack-unified-redis:
        condition: service_healthy
      new-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${LL_TOOL_SERVER_PORT:-8080}/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8787:8787" # GitHub webhook ingress
      - "8789:8789" # Native web UI; NPM proxies https://catalina.dfder.tw here
      # - "43090:8080"  # Uncomment to expose tool server externally


  lilac-claudia:
