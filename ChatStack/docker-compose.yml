  #     - "43005:5001"
  #   environment:
  #     # 解決 NVIDIA ldcache signal 9 錯誤
  #     - NVIDIA_DISABLE_REQUIRE=true
  #     - DOCLING_SERVE_ENABLE_UI=true
  #     - TZ=Asia/Taipei # 統一時區設定，保持好習慣喔！
