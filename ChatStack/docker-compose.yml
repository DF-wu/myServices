  # DEPRECATED: kept only for compatibility with existing RAG/document parsing flows.
  tika:
    image: apache/tika:latest-full
    container_name: tika
    user: 3000:3000
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    ports:
      - "59998:9998"
    depends_on:
      # 依賴 PostgreSQL 數據庫
      - chatstack-postgres17-pgvector

  # ollama:
  #     image: ollama/ollama
  #     container_name: ollama
  #     restart: always
  #     ports:
  #       - "11434:11434"
  #     volumes:
  #       - /mnt/appdata/ollamaStack/ollama:/root/.ollama
  #     deploy:
  #       resources:
  #         reservations:
  #           devices:
  #             - driver: nvidia
  #               count: all
  #               capabilities: [gpu]

  #   # api distributor
  #   new-api:
  #     image: calciumion/new-api:latest
  #     # build: .
  #     container_name: new-api
  #     restart: always
  #     command: --log-dir /app/logs
  #     ports:
  #       - "43001:3000"
  #     volumes:
  #       - /mnt/appdata/ChatStack/new-api/data:/data
  #       - /mnt/appdata/ChatStack/new-api/logs:/app/logs
  #     environment:
  #       # - SQL_DSN=root:123456@tcp(host.docker.internal:3306)/new-api  # 修改此行，或注释掉以使用 SQLite 作为数据库
  #       - REDIS_CONN_STRING=redis://redis
  #       - SESSION_SECRET=0  # 修改为随机字符串
  #       - TZ=Asia/Taipei
  # #      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
  # #      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
  # #      - FRONTEND_BASE_URL=https://openai.justsong.cn  # 多机部署时从节点取消注释该行=
  #       - DEBUG=true
  #       - GIN_MODE=debug

  # API distributor. Previously evaluated Veloera; currently using upstream new-api.
  new-api:
    # newapi: calciumion/new-api:latest
    image: calciumion/new-api:latest
    container_name: new-api
    user: 3000:3000
    restart: always
    command: --log-dir /app/logs
    ports:
      - "43001:3000"
    volumes:
      - /mnt/appdata/ChatStack/new-api/data:/data
      - /mnt/appdata/ChatStack/new-api/logs:/app/logs
    environment:
      # 使用統一 Redis 的 Database 2
      - REDIS_CONN_STRING=redis://chatstack-unified-redis:6379/2
      - SESSION_SECRET=0 # 修改为随机字符串
      - TZ=Asia/Taipei
      #      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
      #      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
      #      - FRONTEND_BASE_URL=https://openai.justsong.cn  # 多机部署时从节点取消注释该行=
      - DEBUG=false
      - GIN_MODE=release
      - BATCH_UPDATE_ENABLED=true
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      # migrate to postgres from sqlite
      - SQL_DSN=postgres://postgres:postgres@chatstack-postgres17-pgvector:5432/veloera_db?sslmode=disable

    depends_on:
      chatstack-unified-redis:
        condition: service_started
      chatstack-postgres17-pgvector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cline Pass upstream switcher / console.
  # repo: https://github.com/munmunjaklin458-afk/cline-pass-switcher
  # Sits between the new-api "cline pass" channel (id 316) and api.cline.bot so the real upstream
  # provider behind each cline-pass/* model can be probed, pinned, ordered or excluded from a web UI.
  # - console:        http://<host>:43064/      (admin API + /v1 proxy need the proxyKey)
  # - new-api channel: base_url http://cline-pass-switcher:3123, key = proxyKey
  # - config + secrets: /mnt/appdata/ChatStack/cline-pass-switcher/data/config.json (seeded on the
  #   host, never committed). The env vars below are optional overrides; empty = keep config.json.
  # - upstream publishes no image. dx95/cline-pass-switcher is a GitHub-Actions build of a fork
  #   (xianchoujiduluo/cline-pass-switcher @ cb56f1f) whose server.js / public / package.json were
  #   verified byte-identical to upstream 02538a3 on 2026-10-04 (digest sha256:8dbf0fc6...).
  # - cutover / rollback of the new-api channel: scripts/cline-pass-switcher-cutover.sh
  cline-pass-switcher:
    image: dx95/cline-pass-switcher:latest
    container_name: cline-pass-switcher
    restart: unless-stopped
    ports:
      - "43064:3123"
    volumes:
      - /mnt/appdata/ChatStack/cline-pass-switcher/data:/data
    environment:
      - TZ=Asia/Taipei
      - DATA_DIR=/data
      - BIND_HOST=0.0.0.0
      - PORT=3123
      # Optional overrides (Portainer stack env). Leave empty to use config.json as-is.
      - CLINE_PASS_KEY=${CLINE_PASS_KEY:-}
      - PROXY_KEY=${CLINE_PASS_SWITCHER_PROXY_KEY:-}
      - PUBLIC_BASE_URL=${CLINE_PASS_SWITCHER_PUBLIC_BASE_URL:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3123/api/meta | grep -q configured || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # claude code router docker version.
  # doc: https://linux.do/t/topic/864277
  claude-code-router:
    image: yunxinc/ccr:latest
    container_name: ClaudeCodeRouter
    restart: unless-stopped
    ports:
      - "43056:3456" # ui in host /ui/
    volumes:
      - "/mnt/appdata/ChatStack/ccr/config.json:/root/.claude-code-router/config.json"
    environment:
      - TZ=Asia/Taipei

  # doc: https://github.com/Wei-Shaw/sub2api
  sub2api:
    # Faster than dockerhub wei-shaw/sub2api
    image: ghcr.io/wei-shaw/sub2api
    container_name: sub2api
    restart: unless-stopped
    ports:
      - "43062:8080"
    # allow using http://host.docker.internal:<port> inside containers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/appdata/ChatStack/sub2api/data:/app/data
    environment:
      - AUTO_SETUP=true

      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=release
      # - RUN_MODE=simple
      - TZ=Asia/Taipei

      # use existing ChatStack Postgres (pg17)
      # NOTE: you must create DB first (once): CREATE DATABASE sub2api;
      - DATABASE_HOST=chatstack-postgres17-pgvector
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=sub2api
      - DATABASE_SSLMODE=disable

      # use ChatStack unified redis; allocate DB 6 for sub2api
      - REDIS_HOST=chatstack-unified-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=6
      - REDIS_ENABLE_TLS=false

      - ADMIN_EMAIL=admin@sub2api.local
      - ADMIN_PASSWORD=${DF_PASSWORD:-df}

      # allow CRS sync base_url pointing to LAN / http (migration phase)
      - SECURITY_URL_ALLOWLIST_ENABLED=false
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=true
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=true
    depends_on:
      chatstack-postgres17-pgvector:
        condition: service_started
      chatstack-unified-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


