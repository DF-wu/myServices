# BEGIN MANAGED LIBRECHAT RECIPE — edit librechat/ sources, then run render.py
  librechat-code-init:
    image: ghcr.io/librechat-ai/librechat:v0.8.8@sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    user: 0:0
    network_mode: none
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    mem_limit: 256m
    entrypoint:
    - node
    - -e
    - |
      // Runs only as the recipe's one-shot provisioner when Portainer deploys it.
      const fs = require('node:fs');
      const path = require('node:path');
      const { generateKeyPairSync, randomBytes } = require('node:crypto');

      const root = process.env.RECIPE_STATE_DIR || '/config';
      const appUid = Number(process.env.LIBRECHAT_UID || 3000);
      const appGid = Number(process.env.LIBRECHAT_GID || 3000);
      const codeUid = Number(process.env.CODEAPI_UID || 1000);
      const codeGid = Number(process.env.CODEAPI_GID || 1000);
      for (const id of [appUid, appGid, codeUid, codeGid]) {
        if (!Number.isSafeInteger(id) || id < 0) throw new Error('Invalid recipe UID/GID');
      }
      const masterDir = path.join(root, 'master');
      fs.mkdirSync(masterDir, { recursive: true, mode: 0o700 });
      fs.chmodSync(masterDir, 0o700);
      const masterFile = path.join(masterDir, 'keys.json');
      let keys;
      if (fs.existsSync(masterFile)) {
        try {
          keys = JSON.parse(fs.readFileSync(masterFile, 'utf8'));
        } catch {
          throw new Error('Stored Code Interpreter credentials cannot be read; refusing to replace them');
        }
        if (keys.schema !== 1) throw new Error('Unknown Code Interpreter credential schema');
      } else {
        const jwt = generateKeyPairSync('ed25519');
        const manifest = generateKeyPairSync('ed25519');
        keys = {
          schema: 1,
          jwtPrivate: Buffer.from(jwt.privateKey.export({ type: 'pkcs8', format: 'pem' })).toString('base64'),
          jwtPublic: jwt.publicKey.export({ format: 'jwk' }),
          manifestPrivate: manifest.privateKey.export({ type: 'pkcs8', format: 'der' }).toString('base64'),
          manifestPublic: manifest.publicKey.export({ type: 'spki', format: 'der' }).toString('base64'),
          redisPassword: randomBytes(32).toString('hex'),
          storageAccess: randomBytes(16).toString('hex'),
          storageSecret: randomBytes(32).toString('hex'),
          internalToken: randomBytes(32).toString('hex'),
          egressSecret: randomBytes(32).toString('hex'),
        };
        fs.writeFileSync(masterFile + '.tmp', JSON.stringify(keys), { mode: 0o600 });
        fs.renameSync(masterFile + '.tmp', masterFile);
      }
      // A damaged state must fail, never silently rotate a subset of credentials.
      for (const key of ['jwtPrivate', 'manifestPrivate', 'manifestPublic', 'redisPassword',
        'storageAccess', 'storageSecret', 'internalToken', 'egressSecret']) {
        if (typeof keys[key] !== 'string' || !keys[key]) throw new Error('Incomplete Code Interpreter credentials');
      }
      if (!keys.jwtPublic?.x) throw new Error('Incomplete Code Interpreter verifier');
      const kid = 'chatstack-codeapi-2026-10';
      const redis = { REDIS_PASSWORD: keys.redisPassword };
      const internal = { CODEAPI_INTERNAL_SERVICE_TOKEN: keys.internalToken };
      const roles = {
        app: { CODEAPI_JWT_PRIVATE_KEY_BASE64: keys.jwtPrivate },
        api: { ...redis, ...internal,
          CODEAPI_JWT_JWKS_JSON: JSON.stringify({ keys: [{ ...keys.jwtPublic, kid, alg: 'EdDSA', use: 'sig' }] }) },
        worker: { ...redis, ...internal, CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY: keys.manifestPrivate },
        egress: { ...redis, ...internal, CODEAPI_EGRESS_GRANT_SECRET: keys.egressSecret },
        files: { ...redis, ...internal, MINIO_ACCESS_KEY: keys.storageAccess, MINIO_SECRET_KEY: keys.storageSecret },
        tools: { ...redis, ...internal },
        runner: { SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY: keys.manifestPublic },
        redis,
        storage: { RUSTFS_ACCESS_KEY: keys.storageAccess, RUSTFS_SECRET_KEY: keys.storageSecret },
      };
      for (const [role, values] of Object.entries(roles)) {
        const dir = path.join(root, role);
        const publicOnly = role === 'runner';
        const uid = role === 'app' ? appUid : codeUid;
        const gid = role === 'app' ? appGid : codeGid;
        fs.mkdirSync(dir, { recursive: true });
        fs.chmodSync(dir, publicOnly ? 0o755 : 0o700);
        if (!publicOnly) fs.chownSync(dir, uid, gid);
        const lines = Object.entries(values).map(([key, value]) => {
          if (/[\r\n']/.test(value)) throw new Error('Invalid generated environment value');
          return key + "='" + value + "'";
        }).join('\n') + '\n';
        const file = path.join(dir, 'auth.env');
        fs.writeFileSync(file + '.tmp', lines, { mode: publicOnly ? 0o644 : 0o600 });
        fs.chmodSync(file + '.tmp', publicOnly ? 0o644 : 0o600);
        if (!publicOnly) fs.chownSync(file + '.tmp', uid, gid);
        fs.renameSync(file + '.tmp', file);
      }
      const redisConfig = path.join(root, 'redis', 'redis.conf');
      fs.writeFileSync(redisConfig, 'bind 0.0.0.0\nprotected-mode yes\nappendonly yes\n'
        + 'maxmemory 256mb\nmaxmemory-policy noeviction\ndir /data\nrequirepass ' + keys.redisPassword + '\n', { mode: 0o600 });
      fs.chownSync(redisConfig, codeUid, codeGid);
      for (const data of ['redis-data', 'storage-data']) {
        const dir = path.join(root, data);
        fs.mkdirSync(dir, { recursive: true });
        fs.chownSync(dir, codeUid, codeGid);
      }
      // The image has symlinks from /opt/rustfs into these data directories.
      for (const relative of ['storage-data/.rustfs', 'storage-data/.rustfs/events', 'storage-data/.rustfs/audit']) {
        const dir = path.join(root, relative);
        fs.mkdirSync(dir, { recursive: true });
        fs.chownSync(dir, codeUid, codeGid);
      }
      console.log('Code Interpreter credentials ready; existing signing keys and passwords preserved.');
    volumes:
    - type: volume
      source: librechat_code_keys
      target: /config/master
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_app
      target: /config/app
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_api
      target: /config/api
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_worker
      target: /config/worker
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_egress
      target: /config/egress
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_files
      target: /config/files
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_tools
      target: /config/tools
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_runner
      target: /config/runner
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_redis
      target: /config/redis
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_auth_storage
      target: /config/storage
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_redis_data
      target: /config/redis-data
      read_only: false
      volume:
        nocopy: true
    - type: volume
      source: librechat_code_storage_data
      target: /config/storage-data
      read_only: false
      volume:
        nocopy: true
  librechat-code-packages:
    image: ghcr.io/librechat-ai/code-interpreter-sandbox-runner:sha-2fa9f0d43e8e38b7d6240bc76e2483c6a47c64c7@sha256:eef1c94f1255813c82f636d6aa006e85bf1ccf0d1776aad85fea355838e4bcb7
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    user: 0:0
    mem_limit: 2g
    cpus: 2
    entrypoint:
    - /bin/bash
    - -ec
    - |
      #!/bin/bash
      # Runs in the pinned official baked-runner image, only during Portainer deployment.
      # Read its ext4 image as data; do not mount it, boot a VM, or execute guest code.
      set -euo pipefail
      revision=2fa9f0d43e8e38b7d6240bc76e2483c6a47c64c7
      marker=/runtime/.recipe-revision
      if [ -f "$$marker" ]; then
          [ "$$(cat "$$marker")" = "$$revision" ] || { echo 'Runtime volume revision mismatch' >&2; exit 1; }
          for runtime in python/3.14.4 node/24.22.1 bun/1.4.4 bash/5.2.0; do
              test -f "/runtime/$$runtime/.package-installed"
          done
          echo 'Pinned offline language packages already prepared.'
          exit 0
      fi
      test -s /sandbox-rootfs.img
      # Fedora's launcher image does not include debugfs. Install the reader in this
      # disposable provisioner, never in the sandbox or on the Docker host.
      dnf -y --setopt=install_weak_deps=False install e2fsprogs
      stage=/runtime/.extract
      rm -rf "$$stage"
      mkdir -p "$$stage"
      debugfs -R "rdump /pkgs $$stage" /sandbox-rootfs.img
      for runtime in python/3.14.4 node/24.22.1 bun/1.4.4 bash/5.2.0; do
          test -f "$$stage/pkgs/$$runtime/.package-installed"
      done
      cp -a "$$stage/pkgs/." /runtime/
      rm -rf "$$stage"
      chmod -R a+rX /runtime
      printf '%s\n' "$$revision" > "$$marker"
      echo 'Official Python, Node.js, Bun/TypeScript and Bash offline packages prepared.'
    volumes:
    - type: volume
      source: librechat_code_packages_v1_10_13
      target: /runtime
      read_only: false
      volume:
        nocopy: true
  librechat:
    image: ghcr.io/librechat-ai/librechat:v0.8.8@sha256:5b706bcee1ca154a1e2987303aaeca0eb27f97919cccee4bb604226c2f8abf61
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    user: 3000:3000
    init: true
    ports:
    - ${LIBRECHAT_HOST_BIND:-192.168.10.13}:${LIBRECHAT_HOST_PORT:-43065}:3080
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |-
      set -a
      . /run/codeauth/auth.env
      set +a
      node -e "$$LIBRECHAT_RECIPE_CONFIG_SCRIPT"
      exec npm run backend
    environment:
      HOST: 0.0.0.0
      PORT: '3080'
      NODE_ENV: production
      TZ: Asia/Taipei
      ENDPOINTS: custom,agents
      ALLOW_EMAIL_LOGIN: 'true'
      ALLOW_REGISTRATION: 'false'
      ALLOW_SOCIAL_LOGIN: 'false'
      ALLOW_SOCIAL_REGISTRATION: 'false'
      MONGO_URI: mongodb://librechat-mongodb:27017/LibreChat
      SEARCH: 'true'
      MEILI_HOST: http://librechat-meilisearch:7700
      RAG_API_URL: http://librechat-rag-api:8000
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      CONFIG_PATH: /app/data/librechat.recipe.yaml
      LIBRECHAT_RECIPE_CONFIG_SCRIPT: |
        // Read the original YAML; write an effective copy without changing host appdata.
        const fs = require('node:fs');
        const { parseEnv } = require('node:util');
        const yaml = require('js-yaml');

        const legacyEnv = parseEnv(fs.readFileSync(process.env.RECIPE_LEGACY_ENV || '/app/.env', 'utf8'));
        for (const [name, length] of [['CREDS_KEY', 64], ['CREDS_IV', 32]]) {
          if (!new RegExp('^[a-fA-F0-9]{' + length + '}$$').test(legacyEnv[name] || '')) {
            throw new Error('Existing LibreChat ' + name + ' is missing or invalid; refusing to replace it');
          }
        }
        for (const name of ['JWT_SECRET', 'JWT_REFRESH_SECRET', 'MEILI_MASTER_KEY', 'DF_LLM_API_KEY']) {
          if (!legacyEnv[name]) throw new Error('Existing LibreChat ' + name + ' is required');
        }
        const config = yaml.load(fs.readFileSync(process.env.RECIPE_LEGACY_CONFIG || '/run/librechat/librechat.yaml', 'utf8'));
        if (!config || typeof config !== 'object' || !Array.isArray(config.endpoints?.custom)) {
          throw new Error('Existing LibreChat custom endpoints are missing; refusing an empty replacement');
        }
        config.endpoints.agents ||= {};
        const capabilities = new Set(config.endpoints.agents.capabilities || [
          'file_search', 'artifacts', 'actions', 'tools', 'context', 'skills',
        ]);
        for (const value of ['execute_code', 'run_in_background', 'programmatic_tools']) capabilities.add(value);
        // The local HTTP backend is stateless. A stateful toggle without a backend fails.
        capabilities.delete('stateful_code_sessions');
        config.endpoints.agents.capabilities = [...capabilities];
        const output = process.env.CONFIG_PATH || '/app/data/librechat.recipe.yaml';
        fs.writeFileSync(output, yaml.dump(config, { lineWidth: 120 }), { mode: 0o600 });
        console.log('LibreChat effective configuration prepared; original YAML and endpoint credentials preserved.');
      LIBRECHAT_CODE_BASEURL: http://librechat-code-api:3112/v1
      LIBRECHAT_CODE_API_KEY: ''
      CODEAPI_AUTH_PROVIDER: librechat-jwt
      CODEAPI_JWT_ENABLED: 'true'
      CODEAPI_JWT_ALGORITHM: EdDSA
      CODEAPI_JWT_KID: chatstack-codeapi-2026-10
      CODEAPI_JWT_ISSUER: librechat
      CODEAPI_JWT_AUDIENCE: codeapi
      CODEAPI_JWT_TTL_SECONDS: '300'
      CODEAPI_JWT_SINGLE_TENANT_ID: legacy
      LIBRECHAT_CODE_SANDBOX_OUTPUT_MAX_SIZE: '65536'
    volumes:
    - type: bind
      source: /mnt/appdata/ChatStack/librechat/config/app.env
      target: /app/.env
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /mnt/appdata/ChatStack/librechat/config/librechat.yaml
      target: /run/librechat/librechat.yaml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /mnt/appdata/ChatStack/librechat/images
      target: /app/client/public/images
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /mnt/appdata/ChatStack/librechat/uploads
      target: /app/uploads
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /mnt/appdata/ChatStack/librechat/logs
      target: /app/logs
      read_only: false
      bind:
        create_host_path: false
