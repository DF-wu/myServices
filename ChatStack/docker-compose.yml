# author : df
# version: 1.2
# date: 2026.6.6
# description: ChatStack AI services
# doc: https://github.com/open-webui/open-webui
# active host port index (sorted)
# format: <host_port> | <service>
# -  8317 | gluetun-proxy
# -  8787 | lilac
# -  8788 | lilac-claudia (GitHub webhook)
# -  8789 | lilac-catalina (native web UI)
# -  8790 | lilac-claudia (native web UI)
# - 19000 | gluetun-proxy
# - 43000 | open-webui
# - 43001 | new-api
# - 43002 | open-webui
# - 43003 | sillytavern
# - 43004 | astrbot
# - 43020 | chatstack-postgres17-pgvector
# - 43056 | claude-code-router
# - 43061 | api-conversion
# - 43062 | sub2api
# - 43063 | infinite-canvas
# - 43064 | cline-pass-switcher
# - 43065 | librechat（含自架 Code Interpreter，部署說明見 librechat/README.md）
# - 43066 | deepseek-harness（獨立 stack，見 deepseek-harness/）
# - 43067 | cc-switch-web（獨立 stack，見 cc-switch-web/）
# - 43068 | nyaproxy-gateway（獨立 stack，見 nyaproxy/）
# - 43080 | telegram-chatbot (legacy profile)
# - 59998 | tika

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:ollama
    container_name: open-webui-ollama
    restart: unless-stopped
    ports:
      - "43000:8080"
      # Expose Open WebUI's bundled Ollama API on the host.
      - "43002:11434"
    environment:
      # - OLLAMA_BASE_URL=ollama:11434
      - OLLAMA_BASE_URL=http://localhost:11434
      # 解決 NVIDIA ldcache signal 9 錯誤
      - NVIDIA_DISABLE_REQUIRE=true
      # 聽說加這個可以解神奇的問題
      - OPENAI_API_KEY=0
      - GLOBAL_LOG_LEVEL="DEBUG"

      # Listen on all container interfaces for the Ollama-compatible endpoint.
      - OLLAMA_HOST=0.0.0.0
      - TZ=Asia/Taipei

      # Store Open WebUI data in the shared PostgreSQL + pgvector database.
      - DATABASE_URL=postgresql://postgres:postgres@chatstack-postgres17-pgvector:5432/openwebui_db
      - VECTOR_DB=pgvector

      - ENABLE_WEBSOCKET_SUPPORT=true
      - WEBSOCKET_MANAGER="redis"
      # 使用統一 Redis 的 Database 1
      - WEBSOCKET_REDIS_URL="redis://chatstack-unified-redis:6379/1"

      # Allow larger streaming chunks for long responses.
      - CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE=20971520

      - ENABLE_RAG_WEB_SEARCH=true
      # - RAG_WEB_SEARCH_ENGINE="searxng"
      # - RAG_WEB_SEARCH_RESULT_COUNT=5
      # - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      # - SEARXNG_QUERY_URL=http://axolotl.newhome:43004/search?safesearch=0&language=auto&format=json&q=<query>
    volumes:
      - /mnt/appdata/ChatStack/ollama:/root/.ollama
      - /mnt/appdata/ChatStack/open-webui:/app/backend/data
    depends_on:
      chatstack-unified-redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video]

  # https://docs.openwebui.com/tutorials/integrations/redis/
  # 統一的 Redis 服務，使用不同數據庫編號分離數據
  # Database 分配：
  # - Database 1: open-webui (WebSocket 支援)
  # - Database 2: new-api (API distributor; DB name kept as veloera_db)
  # - Database 3: searxng (搜尋引擎快取) - TODO: 需配置 searxng settings.yml
  # - Database 5: lilac-mono
  # - Database 6: sub2api (CRS 2.0)
  # - Database 7: lilac-mono-claudia
  chatstack-unified-redis:
    image: docker.io/valkey/valkey:8-alpine
    container_name: chatstack-unified-redis
    user: 3000:3000
    volumes:
      - /mnt/appdata/ChatStack/unified-redis:/data
    command: "valkey-server --save 30 1"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 20s
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # IBM Docling candidate for replacing Tika.
  # Check upstream releases before enabling, because CUDA image tags vary.
  # docling:
  #   image: quay.io/docling-project/docling-serve-cu128
  #   container_name: docling-serve
  #   user: 3000:3000
  #   restart: unless-stopped
  #   ports:
  #     - "43005:5001"
  #   environment:
  #     # 解決 NVIDIA ldcache signal 9 錯誤
  #     - NVIDIA_DISABLE_REQUIRE=true
  #     - DOCLING_SERVE_ENABLE_UI=true
  #     - TZ=Asia/Taipei # 統一時區設定，保持好習慣喔！
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all # 這裡設定為 all，與你 docker run 指令的 --gpus all 相符
  #             capabilities: [gpu, compute] # 確保 GPU 運算能力能被正確識別和使用

  # DEPRECATED: kept only for compatibility with existing RAG/document parsing flows.
  tika:
    image: apache/tika:latest-full
    container_name: tika
    user: 3000:3000
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    ports:
      - "59998:9998"
    depends_on:
      # 依賴 PostgreSQL 數據庫
      - chatstack-postgres17-pgvector

  # ollama:
  #     image: ollama/ollama
  #     container_name: ollama
  #     restart: always
  #     ports:
  #       - "11434:11434"
  #     volumes:
  #       - /mnt/appdata/ollamaStack/ollama:/root/.ollama
  #     deploy:
  #       resources:
  #         reservations:
  #           devices:
  #             - driver: nvidia
  #               count: all
  #               capabilities: [gpu]

  #   # api distributor
  #   new-api:
  #     image: calciumion/new-api:latest
  #     # build: .
  #     container_name: new-api
  #     restart: always
  #     command: --log-dir /app/logs
  #     ports:
  #       - "43001:3000"
  #     volumes:
  #       - /mnt/appdata/ChatStack/new-api/data:/data
  #       - /mnt/appdata/ChatStack/new-api/logs:/app/logs
  #     environment:
  #       # - SQL_DSN=root:123456@tcp(host.docker.internal:3306)/new-api  # 修改此行，或注释掉以使用 SQLite 作为数据库
  #       - REDIS_CONN_STRING=redis://redis
  #       - SESSION_SECRET=0  # 修改为随机字符串
  #       - TZ=Asia/Taipei
  # #      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
  # #      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
  # #      - FRONTEND_BASE_URL=https://openai.justsong.cn  # 多机部署时从节点取消注释该行=
  #       - DEBUG=true
  #       - GIN_MODE=debug

  # API distributor. Previously evaluated Veloera; currently using upstream new-api.
  new-api:
    # newapi: calciumion/new-api:latest
    image: calciumion/new-api:latest
    container_name: new-api
    user: 3000:3000
    restart: always
    command: --log-dir /app/logs
    ports:
      - "43001:3000"
    volumes:
      - /mnt/appdata/ChatStack/new-api/data:/data
      - /mnt/appdata/ChatStack/new-api/logs:/app/logs
    environment:
      # 使用統一 Redis 的 Database 2
      - REDIS_CONN_STRING=redis://chatstack-unified-redis:6379/2
      - SESSION_SECRET=0 # 修改为随机字符串
      - TZ=Asia/Taipei
      #      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
      #      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
      #      - FRONTEND_BASE_URL=https://openai.justsong.cn  # 多机部署时从节点取消注释该行=
      - DEBUG=false
      - GIN_MODE=release
      - BATCH_UPDATE_ENABLED=true
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      # migrate to postgres from sqlite
      - SQL_DSN=postgres://postgres:postgres@chatstack-postgres17-pgvector:5432/veloera_db?sslmode=disable

    depends_on:
      chatstack-unified-redis:
        condition: service_started
      chatstack-postgres17-pgvector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cline Pass upstream switcher / console.
  # repo: https://github.com/munmunjaklin458-afk/cline-pass-switcher
  # Sits between the new-api "cline pass" channel (id 316) and api.cline.bot so the real upstream
  # provider behind each cline-pass/* model can be probed, pinned, ordered or excluded from a web UI.
  # - console:        http://<host>:43064/      (admin API + /v1 proxy need the proxyKey)
  # - new-api channel: base_url http://cline-pass-switcher:3123, key = proxyKey
  # - config + secrets: /mnt/appdata/ChatStack/cline-pass-switcher/data/config.json (seeded on the
  #   host, never committed). The env vars below are optional overrides; empty = keep config.json.
  # - upstream publishes no image. dx95/cline-pass-switcher is a GitHub-Actions build of a fork
  #   (xianchoujiduluo/cline-pass-switcher @ cb56f1f) whose server.js / public / package.json were
  #   verified byte-identical to upstream 02538a3 on 2026-10-04 (digest sha256:8dbf0fc6...).
  # - cutover / rollback of the new-api channel: scripts/cline-pass-switcher-cutover.sh
  cline-pass-switcher:
    image: dx95/cline-pass-switcher:latest
    container_name: cline-pass-switcher
    restart: unless-stopped
    ports:
      - "43064:3123"
    volumes:
      - /mnt/appdata/ChatStack/cline-pass-switcher/data:/data
    environment:
      - TZ=Asia/Taipei
      - DATA_DIR=/data
      - BIND_HOST=0.0.0.0
      - PORT=3123
      # Optional overrides (Portainer stack env). Leave empty to use config.json as-is.
      - CLINE_PASS_KEY=${CLINE_PASS_KEY:-}
      - PROXY_KEY=${CLINE_PASS_SWITCHER_PROXY_KEY:-}
      - PUBLIC_BASE_URL=${CLINE_PASS_SWITCHER_PUBLIC_BASE_URL:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3123/api/meta | grep -q configured || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # claude code router docker version.
  # doc: https://linux.do/t/topic/864277
  claude-code-router:
    image: yunxinc/ccr:latest
    container_name: ClaudeCodeRouter
    restart: unless-stopped
    ports:
      - "43056:3456" # ui in host /ui/
    volumes:
      - "/mnt/appdata/ChatStack/ccr/config.json:/root/.claude-code-router/config.json"
    environment:
      - TZ=Asia/Taipei

  # doc: https://github.com/Wei-Shaw/sub2api
  sub2api:
    # Faster than dockerhub wei-shaw/sub2api
    image: ghcr.io/wei-shaw/sub2api
    container_name: sub2api
    restart: unless-stopped
    ports:
      - "43062:8080"
    # allow using http://host.docker.internal:<port> inside containers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/appdata/ChatStack/sub2api/data:/app/data
    environment:
      - AUTO_SETUP=true

      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=release
      # - RUN_MODE=simple
      - TZ=Asia/Taipei

      # use existing ChatStack Postgres (pg17)
      # NOTE: you must create DB first (once): CREATE DATABASE sub2api;
      - DATABASE_HOST=chatstack-postgres17-pgvector
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=sub2api
      - DATABASE_SSLMODE=disable

      # use ChatStack unified redis; allocate DB 6 for sub2api
      - REDIS_HOST=chatstack-unified-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=6
      - REDIS_ENABLE_TLS=false

      - ADMIN_EMAIL=admin@sub2api.local
      - ADMIN_PASSWORD=${DF_PASSWORD:-df}

      # allow CRS sync base_url pointing to LAN / http (migration phase)
      - SECURITY_URL_ALLOWLIST_ENABLED=false
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=true
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=true
    depends_on:
      chatstack-postgres17-pgvector:
        condition: service_started
      chatstack-unified-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # AI creation infinite canvas workspace
  # doc: https://github.com/basketikun/infinite-canvas
  infinite-canvas:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    restart: unless-stopped
    ports:
      - "43063:3000"
    volumes:
      - /mnt/appdata/ChatStack/infinite-canvas/data:/app/data
    environment:
      - ADMIN_USERNAME=df
      - ADMIN_PASSWORD=${DF_PASSWORD:-passwd}
      - JWT_SECRET=${INFINITE_CANVAS_JWT_SECRET:-dfdfdfdfdfdfdfdfdfdfdfdfdfdfdfdf}
      - JWT_EXPIRE_HOURS=168
      - STORAGE_DRIVER=postgres
      - DATABASE_DSN=postgres://postgres:postgres@chatstack-postgres17-pgvector:5432/infinite_canvas?sslmode=disable
      - PUBLIC_BASE_URL=${INFINITE_CANVAS_PUBLIC_BASE_URL:-http://example.com}
      - NEXT_PUBLIC_DOC_URL=https://docs.canvas.best
      - TZ=Asia/Taipei
    depends_on:
      chatstack-postgres17-pgvector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Chinrain API conversion proxy.
  api-conversion:
    image: ghcr.io/chinrain/api-conversion:0.2.4
    container_name: api-conversion
    restart: unless-stopped
    ports:
      - "43061:8000"
    env_file:
      - .api-conversion.env
    environment:
      - TZ=Asia/Taipei
    volumes:
      - /mnt/appdata/ChatStack/api-conversion/data:/app/data
      - /mnt/appdata/ChatStack/api-conversion/logs:/app/logs

  # # Whisper-FastAPI - Speech-to-Text service (OpenAI Whisper-compatible)
  # # repo: https://github.com/heimoshuiyu/whisper-fastapi
  # # endpoints:
  # # - OpenAI Whisper: http://localhost:43059/v1/audio/transcriptions
  # # - Wyoming (Home Assistant): tcp://localhost:43060
  # # notes:
  # # - 初次啟動會自動從 HuggingFace 下載模型到 hf-cache 目錄。
  # # - 預設使用 faster-whisper，CPU 也可跑（建議模型改為 small / medium）。
  # # - 需要 GPU 時，取消註解 deploy.resources 區塊，或用 Portainer 勾選 GPU。
  # whisper-fastapi:
  #   image: docker.io/heimoshuiyu/whisper-fastapi:latest
  #   container_name: whisper-fastapi
  #   restart: unless-stopped
  #   # 若使用 GPU，建議保留 root 權限以避免快取目錄權限問題
  #   # user: 3000:3000
  #   ports:
  #     - "43059:5000" # HTTP API: /v1/audio/transcriptions
  #     - "43060:3001" # Wyoming protocol (optional)
  #   environment:
  #     - TZ=Asia/Taipei
  #     # 修正常見 NVIDIA 驅動檢查問題（若使用 GPU）
