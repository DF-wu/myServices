version: "3.3"
services:
  portainer_agent:
    image: portainer/agent:2.45.3@sha256:6e6d2d5d8967da5b4d45eab32b7268af170395395d753d3f34ecb4d6ca5bd388
    restart: always
    container_name: portainer_agent
    ports:
      - 29001:9001
    environment:
      - TZ=Asia/Taipei
    volumes:
      # To enable host management. Ref: https://docs.portainer.io/user/docker/host/setup#enable-host-management-features
      - /:/host
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    
