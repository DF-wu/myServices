services:
  ddns-init:
    # Immutable compatibility image containing the fail-safe DDNS watcher.
    image: ghcr.io/df-wu/ddns-openvpn-proxy-watcher:compat-ca5200d28ac992c8c71200fe49c7d24f850133b3
    restart: no
    volumes:
      - ${OPENVPN_CONFIG_DIR:-./config}:/gluetun/source:ro
      - ${STATE_DIR:-./state}:/gluetun/state
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      OPENVPN_SOURCE_CONFIG: ${OPENVPN_SOURCE_CONFIG:-}
      OPENVPN_SOURCE_DIR: /gluetun/source/openvpn
      OPENVPN_RENDERED_CONFIG: /gluetun/state/openvpn/current.ovpn
      DDNS_HOSTNAME: ${DDNS_HOSTNAME:-}
      DDNS_POLL_SECONDS: ${DDNS_POLL_SECONDS:-60}
      DDNS_COOLDOWN_SECONDS: ${DDNS_COOLDOWN_SECONDS:-15}
      DDNS_RESOLVER: ${DDNS_RESOLVER:-}
      DDNS_OVERRIDE_IP: ${DDNS_OVERRIDE_IP:-}
      STATE_DIR: /gluetun/state
    entrypoint: ["/app/scripts/ddns-init.sh"]

  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:latest}
    container_name: ${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      ddns-init:
        condition: service_completed_successfully
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HTTP_PROXY_PORT:-28888}:8888/tcp"
      # SOCKS5 proxy 端口映射：vproxy sidecar 共享 gluetun 網路命名空間，
      # 因此端口必須在 gluetun 服務上宣告，才能從主機訪問。
      - "${SOCKS5_PROXY_PORT:-21080}:1080/tcp"
    volumes:
      - ${OPENVPN_CONFIG_DIR:-./config}:/gluetun/source:ro
      - ${STATE_DIR:-./state}:/gluetun/state
    environment:
      TZ: ${TZ:-UTC}
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: /gluetun/state/openvpn/current.ovpn
      HTTPPROXY: on
      HTTPPROXY_LISTENING_ADDRESS: :8888
      HTTPPROXY_USER: ${HTTPPROXY_USER:-}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD:-}
      HTTPPROXY_STEALTH: on

  # vproxy sidecar：提供 SOCKS5 proxy，與 gluetun 共用網路命名空間
  # 所有 SOCKS5 流量會自動走 VPN tunnel 出去
  vproxy:
    # 建議固定版本，避免 upstream 改行為
    image: ghcr.io/0x676e67/vproxy:v2.5.5
    container_name: ddns-vpn-proxy-vproxy
    restart: unless-stopped
    init: true

    # 共享 gluetun 網路命名空間，因此 SOCKS5 流量自動走 VPN tunnel
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started

    # 安全強化
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL

    # Portainer Stack variables are interpolation inputs only; explicitly pass
    # SOCKS5 credentials into the container. Required expansion makes the
    # deployment fail closed instead of starting an anonymous public proxy.
    environment:
      SOCKS5_USER: ${SOCKS5_USER:?SOCKS5_USER is required}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:?SOCKS5_PASSWORD is required}
      VPROXY_CONCURRENT: ${VPROXY_CONCURRENT:-1024}
      VPROXY_CONNECT_TIMEOUT: ${VPROXY_CONNECT_TIMEOUT:-300}

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec vproxy run -b 0.0.0.0:1080 \
          -c "$${VPROXY_CONCURRENT}" \
          -t "$${VPROXY_CONNECT_TIMEOUT}" \
          socks5 \
          -u "$${SOCKS5_USER}" \
          -p "$${SOCKS5_PASSWORD}"

    # 同時確認 listener、VPN interface 與出口 route，避免舊 namespace 假健康。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ss -ltn | grep -q ':1080' &&
          test -d /sys/class/net/tun0 &&
          ip -4 route get 1.1.1.1 2>/dev/null | grep -q ' dev tun0 '
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 避免 json-file log 無限長大
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ddns-watcher:
    image: ghcr.io/df-wu/ddns-openvpn-proxy-watcher:compat-ca5200d28ac992c8c71200fe49c7d24f850133b3
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
      vproxy:
        condition: service_healthy
    volumes:
      - ${OPENVPN_CONFIG_DIR:-./config}:/gluetun/source:ro
      - ${STATE_DIR:-./state}:/gluetun/state
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      TZ: ${TZ:-UTC}
      OPENVPN_SOURCE_CONFIG: ${OPENVPN_SOURCE_CONFIG:-}
      OPENVPN_SOURCE_DIR: /gluetun/source/openvpn
      OPENVPN_RENDERED_CONFIG: /gluetun/state/openvpn/current.ovpn
      DDNS_HOSTNAME: ${DDNS_HOSTNAME:-}
      DDNS_POLL_SECONDS: ${DDNS_POLL_SECONDS:-60}
      DDNS_COOLDOWN_SECONDS: ${DDNS_COOLDOWN_SECONDS:-15}
      DDNS_RESOLVER: ${DDNS_RESOLVER:-}
      DDNS_OVERRIDE_IP: ${DDNS_OVERRIDE_IP:-}
      GLUETUN_CONTAINER_NAME: ${GLUETUN_CONTAINER_NAME:-ddns-openvpn-proxy}
      VPROXY_CONTAINER_NAME: ddns-vpn-proxy-vproxy
      GLUETUN_HEALTH_TIMEOUT_SECONDS: 120
      STATE_DIR: /gluetun/state
