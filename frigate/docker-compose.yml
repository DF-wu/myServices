services:
  frigate:
    container_name: frigate
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:0.18.2-tensorrt
    shm_size: "2048mb"
    stop_grace_period: 30s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Keep SQLite, model cache and face library together on local storage.
      # /mnt/appdata is NFS on this host; do not put the SQLite database there.
      - type: bind
        source: ${FRIGATE_CONFIG_DIR:-/var/lib/frigate/config}
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ${FRIGATE_MEDIA_DIR:-/mnt/mydata/frigate_data}
        target: /media/frigate
        bind:
          create_host_path: false
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "55000:8971" # Authenticated HTTPS UI/API; port 5000 stays internal.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      TZ: Asia/Taipei
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      # Dedicated camera secret; do not reuse the shared DF_PASSWORD.
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:?Set a dedicated camera password}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"] # Tesla P4 on the current host.
              capabilities: [gpu]
