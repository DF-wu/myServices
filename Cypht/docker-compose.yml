services:
  db:
    image: mariadb:10
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: cypht
      MARIADB_USER: cypht
      MARIADB_PASSWORD: cypht
      MARIADB_ROOT_PASSWORD: cypht
    volumes:
      - cypht-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cypht:
    image: cypht/cypht:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-58090}:80"
    environment:
      AUTH_TYPE: DB
      USER_CONFIG_TYPE: DB
      SESSION_TYPE: DB
      DB_DRIVER: mysql
      DB_CONNECTION_TYPE: host
      DB_HOST: db
      DB_NAME: cypht
      DB_USER: cypht
      DB_PASS: cypht
      AUTH_USERNAME: ${AUTH_USERNAME:-df}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-${DF_PASSWORD}}
      ATTACHMENT_DIR: /var/lib/hm3/attachments
      ENABLE_REDIS: "false"
      ENABLE_MEMCACHED: "false"
      ENABLE_DEBUG: "false"
      XDEBUG_MODE: "off"
      DISABLE_ORIGIN_CHECK: "false"
    volumes:
      - ${ATTACHMENT_DIR:-/mnt/appdata/Cypht/attachments}:/var/lib/hm3/attachments
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  cypht-db:
    driver: local
