services:
  openlist:
    image: openlistteam/openlist:latest
    restart: unless-stopped
    container_name: openlist
    ports:
      # container ports
      - 55245:5245
      - 55244:5244
      # sftp access
      - 55222:5222

    volumes:
      # appdata config
      - /mnt/appdata/openlist:/opt/openlist/data
    environment:
      - TZ=Asia/Taipei

  sinclair-od-bridge:
    image: node:24-bookworm-slim
    container_name: sinclair-od-bridge
    hostname: sinclair-od-bridge
    restart: unless-stopped
    init: true
    shm_size: 1gb
    stop_grace_period: 30s
    command: ["bash", "/opt/od-bridge/deploy/start.sh"]
    ports:
      - "127.0.0.1:58110:6080"
    volumes:
      - type: bind
        source: ${SINCLAIR_BRIDGE_SOURCE:-/mnt/appdata/openlist-sinclair/runtime/9f0bfbbf393964f2f2bbfa757eb2641d4531b439}
        target: /opt/od-bridge
        read_only: true
        bind:
          create_host_path: false
      - /mnt/appdata/openlist-sinclair/state:/var/lib/od-bridge
    environment:
      TZ: Asia/Taipei
      PUID: "3000"
      PGID: "3000"
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8110"
      BRIDGE_TRANSPORT: http
      BRIDGE_USERNAME: openlist
      BRIDGE_PASSWORD_FILE: /var/lib/od-bridge/private/bridge-password
      CDP_URL: http://127.0.0.1:9222
      OD_HOST: sinclaircc-my.sharepoint.com
      OD_SITE_PATH: /personal/gage_gil_sinclair_edu
      OD_BRIDGE_REVISION: 9f0bfbbf393964f2f2bbfa757eb2641d4531b439
      OD_AUTO_LOGIN: "true"
      OD_CREDENTIALS_FILE: /var/lib/od-bridge/private/account.json
      OPENLIST_URL: http://openlist:5244
      OPENLIST_MOUNT_PATH: /Sinclair_OD
      OPENLIST_ROOT_PATH: /personal/gage_gil_sinclair_edu/Documents
      OPENLIST_TOKEN_FILE: /var/lib/od-bridge/private/openlist-token
      BRIDGE_ADDRESS: http://sinclair-od-bridge:8110
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8110/__health',{signal:AbortSignal.timeout(10000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 15s
      start_period: 10m
      retries: 3

