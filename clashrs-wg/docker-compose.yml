services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    container_name: clashrs-wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "127.0.0.1:${WG_UI_PORT:-51821}:51821/tcp"
      - "127.0.0.1:${MIHOMO_API_PORT:-9090}:9090/tcp"
    volumes:
      - wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_ADMIN_USERNAME:-admin}
      INIT_PASSWORD: ${WG_ADMIN_PASSWORD:?Set the wg-easy admin password}
      INIT_HOST: ${WG_HOST:?Set the public IP or hostname}
      INIT_PORT: ${WG_PORT:-51820}
      INIT_DNS: 10.8.0.1
      INIT_IPV4_CIDR: 10.8.0.0/24
      INIT_IPV6_CIDR: 2001:db8::/32
      INIT_ALLOWED_IPS: 0.0.0.0/0
      DISABLE_IPV6: "true"
      INSECURE: "true"
      TZ: ${TZ:-Asia/Taipei}

  mihomo:
    image: metacubex/mihomo:v1.19.30@sha256:baf38d282b785d7037337676714a69e3fdd1f2d9bf748dfd25fce681a624ea74
    container_name: clashrs-wg-mihomo
    restart: unless-stopped
    network_mode: service:wg-easy
    depends_on:
      - wg-easy
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - mihomo-data:/root/.config/mihomo
      - ${CLASH_YAML_PATH:?Set the absolute Docker-host path to the Clash YAML}:/root/.config/mihomo/import.yaml:ro
    configs:
      - source: mihomo
        target: /root/.config/mihomo/config.yaml
    environment:
      TZ: ${TZ:-Asia/Taipei}

volumes:
  wireguard:
  mihomo-data:

configs:
  mihomo:
    content: |
      mode: rule
      log-level: info
      ipv6: false

      external-controller: 0.0.0.0:9090
      secret: "${MIHOMO_SECRET:-}"

      tun:
        enable: true
        stack: mixed
        auto-route: true
        auto-redirect: true
        auto-detect-interface: true
        strict-route: true
        include-interface:
          - wg0
        dns-hijack:
          - any:53
          - tcp://any:53

      dns:
        enable: true
        ipv6: false
        enhanced-mode: fake-ip
        fake-ip-range: 198.18.0.1/16
        default-nameserver:
          - 1.1.1.1
          - 8.8.8.8
        nameserver:
          - https://1.1.1.1/dns-query
          - https://8.8.8.8/dns-query

      proxy-providers:
        imported:
          type: file
          filter: "${CLASH_NODE_FILTER:?Set a unique subscription node name}"
          path: ./import.yaml
          health-check:
            enable: true
            url: https://www.gstatic.com/generate_204
            interval: 300

      proxy-groups:
        - name: PROXY
          type: select
          use:
            - imported

      rules:
        - MATCH,PROXY
