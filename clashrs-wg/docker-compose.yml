services:
  gateway:
    image: ksantd/wg-gateway:26.08.08.07.41@sha256:514338227f2d8ac6a9ffd2776d44e63c3025cac835445c6c6c4149c3b7d41774
    container_name: clashrs-wg
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - wireguard:/data/wireguard
    configs:
      - source: mihomo
        target: /data/mihomo/config.yaml
    environment:
      WG_HOST: ${WG_HOST:?Set the public IP or hostname}
      WG_EASY_INIT_PASSWORD: ${WG_EASY_INIT_PASSWORD:?Set the wg-easy admin password}
      WG_ALLOWED_IPS: 0.0.0.0/0
      WG_DEFAULT_DNS: 1.1.1.1
      HOST: 127.0.0.1
      INSECURE: "true"
      DISABLE_IPV6: "true"
      TZ: ${TZ:-Asia/Taipei}

volumes:
  wireguard:

configs:
  mihomo:
    content: |
      mode: rule
      log-level: info
      ipv6: false

      external-controller: 127.0.0.1:51888
      external-ui: /data/mihomo/ui
      secret: "${MIHOMO_SECRET:-}"

      tun:
        enable: true
        stack: mixed
        auto-route: false
        auto-detect-interface: true
        dns-hijack:
          - any:53

      dns:
        enable: true
        ipv6: false
        enhanced-mode: fake-ip
        fake-ip-range: 198.18.0.1/16
        default-nameserver:
          - 1.1.1.1
          - 8.8.8.8
        nameserver:
          - https://1.1.1.1/dns-query
          - https://8.8.8.8/dns-query

      proxy-providers:
        subscription:
          type: http
          url: "${CLASH_SUBSCRIPTION_URL:?Set the Clash subscription URL}"
          path: /data/mihomo/providers/subscription.yaml
          interval: 3600
          health-check:
            enable: true
            url: https://www.gstatic.com/generate_204
            interval: 300

      proxy-groups:
        - name: PROXY
          type: url-test
          use:
            - subscription
          url: https://www.gstatic.com/generate_204
          interval: 300
          tolerance: 80

      rules:
        - MATCH,PROXY
