services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    container_name: wg-clash-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "${WG_UI_BIND:-127.0.0.1}:${WG_UI_PORT:-51821}:51821/tcp"
    volumes:
      - wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      TZ: ${TZ:-Asia/Taipei}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clash-rs:
    image: ghcr.io/watfaq/clash-rs:0.10.7@sha256:ca20da62b278ed35764be310d9353b536d3c83f353f52e9eb7187a56cae8a094
    container_name: wg-clash-core
    restart: unless-stopped
    network_mode: "service:wg-easy"
    depends_on:
      wg-easy:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      - clash-data:/data
    configs:
      - source: clash_config
        target: /etc/clash/config.yaml
    environment:
      TZ: ${TZ:-Asia/Taipei}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache iproute2 nftables

        until ip link show wg0 >/dev/null 2>&1; do sleep 1; done
        nft delete table inet wg_clash_gateway 2>/dev/null || true
        ip rule del fwmark 0x1 lookup 100 priority 100 2>/dev/null || true
        ip route flush table 100 2>/dev/null || true
        ip route add local 0.0.0.0/0 dev lo table 100
        ip rule add fwmark 0x1 lookup 100 priority 100

        nft -f - <<'EOF'
        table inet wg_clash_gateway {
          chain prerouting {
            type filter hook prerouting priority mangle; policy accept;
            iifname "wg0" fib daddr type local return
            iifname "wg0" meta l4proto { tcp, udp } meta mark set 0x1 tproxy to :7893 accept
            iifname "wg0" counter drop
          }
          chain forward_guard {
            type filter hook forward priority -1; policy accept;
            iifname "wg0" counter drop
          }
        }
        EOF

        exec /usr/bin/clash --compatibility --directory /data --config /etc/clash/config.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wireguard:
  clash-data:

configs:
  clash_config:
    content: |
      mode: rule
      log-level: info
      ipv6: false
      allow-lan: false
      external-controller: 127.0.0.1:9090
      tproxy-port: 7893
      dns:
        enable: true
        ipv6: false
        listen:
          udp: 0.0.0.0:53
          tcp: 0.0.0.0:53
        enhanced-mode: fake-ip
        fake-ip-range: 198.18.0.1/16
        fake-ip-filter:
          - "*.lan"
          - "localhost"
        default-nameserver:
          - 1.1.1.1
          - 8.8.8.8
        nameserver:
          - "https://1.1.1.1/dns-query#proxy=PROXY"
          - "https://8.8.8.8/dns-query#proxy=PROXY"
        proxy-server-nameserver:
          - 1.1.1.1
          - 8.8.8.8
      profile:
        store-selected: true
        store-fake-ip: true
      proxy-providers:
        subscription:
          type: http
          url: "${CLASH_SUBSCRIPTION_URL:?Set CLASH_SUBSCRIPTION_URL in Portainer}"
          path: ./providers/subscription.yaml
          interval: 3600
          health-check:
            enable: true
            url: https://www.gstatic.com/generate_204
            interval: 300
            lazy: true
      proxy-groups:
        - name: PROXY
          type: url-test
          use:
            - subscription
          url: https://www.gstatic.com/generate_204
          interval: 300
          lazy: true
          tolerance: 80
          udp: true
      rules:
        - MATCH,PROXY
