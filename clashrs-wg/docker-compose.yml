services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    container_name: wg-clash-gateway
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "${WG_UI_BIND:-127.0.0.1}:${WG_UI_PORT:-51821}:51821/tcp"
    volumes:
      - ${APPDATA_DIR:?Set APPDATA_DIR to an absolute Docker-host path}/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      TZ: ${TZ:-Asia/Taipei}
    networks:
      gateway:
        ipv4_address: 172.30.90.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clash-rs:
    build:
      context: .
      dockerfile: Dockerfile.clash-rs
      args:
        CLASH_RS_VERSION: ${CLASH_RS_VERSION:-0.10.8}
        CLASH_RS_AMD64_SHA256: ${CLASH_RS_AMD64_SHA256:-551f3f9e71a8f344416219ba300af2f3aced6f1e1d2eee6fdc1f256e7a011776}
        CLASH_RS_ARM64_SHA256: ${CLASH_RS_ARM64_SHA256:-c3ebf9da1a89d5fce30bb64058a2143e4c67e0eb3092343bc9c768420c0a2072}
    image: local/clash-rs:${CLASH_RS_VERSION:-0.10.8}
    container_name: wg-clash-core
    restart: unless-stopped
    network_mode: "service:wg-easy"
    depends_on:
      wg-easy:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${APPDATA_DIR:?Set APPDATA_DIR to an absolute Docker-host path}/clash-rs:/config
    environment:
      TZ: ${TZ:-Asia/Taipei}
      CLASH_SUBSCRIPTION_URL: ${CLASH_SUBSCRIPTION_URL:-}
    command:
      - --compatibility
      - --directory
      - /config
      - --config
      - /config/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9090/version >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway-rules:
    image: local/clash-rs:${CLASH_RS_VERSION:-0.10.8}
    container_name: wg-clash-rules
    restart: unless-stopped
    network_mode: "service:wg-easy"
    depends_on:
      wg-easy:
        condition: service_started
      clash-rs:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/usr/local/sbin/gateway-rules.sh"]
    healthcheck:
      test: ["CMD-SHELL", "nft list table inet wg_clash_gateway >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.90.0/24
