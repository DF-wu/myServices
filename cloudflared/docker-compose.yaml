version: "3"

# author: df
# description: cloudflared for tunnel
# doc: https://github.com/cloudflare/cloudflared
# require env:
# CLOUDFLARED_TOKEN: the token for your tunnel

services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    environment:
      - TZ=Asia/Taipei
